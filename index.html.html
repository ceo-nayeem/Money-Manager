<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinVault – Money Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080b12;--bg2:#0f1320;--bg3:#161b2e;--bg4:#1c2338;--bg5:#222a40;
  --border:#ffffff0d;--border2:#ffffff1a;--border3:#ffffff28;
  --text:#eef2ff;--text2:#7b88a8;--text3:#404d6a;
  --accent:#4f8ef7;--accent2:#7c3aed;--accent3:#10b981;--accent4:#f59e0b;--accent5:#ef4444;--accent6:#ec4899;
  --card-radius:14px;--sidebar-w:240px;
}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;min-height:100vh;overflow-x:hidden}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;transition:transform 0.3s ease}
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column}
.logo{padding:22px 20px 18px;border-bottom:1px solid var(--border)}
.logo-mark{font-size:19px;font-weight:700;letter-spacing:-0.5px;background:linear-gradient(135deg,#4f8ef7,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:9px;color:var(--text3);letter-spacing:2.5px;text-transform:uppercase;margin-top:3px}
.nav-section{padding:18px 20px 6px;font-size:9.5px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;font-size:13px;color:var(--text2);transition:all 0.18s;border-left:2px solid transparent;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--accent);border-left-color:var(--accent)}
.nav-icon{width:15px;height:15px;flex-shrink:0;opacity:0.75}
.nav-item.active .nav-icon{opacity:1}
.sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border)}
.user-info{display:flex;align-items:center;gap:10px;cursor:pointer}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#4f8ef7,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.user-name{font-size:12px;font-weight:600}
.user-plan{font-size:10px;color:var(--text3);margin-top:1px}
.hamburger{display:none;position:fixed;top:14px;left:14px;z-index:60;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:8px;cursor:pointer;color:var(--text);align-items:center;justify-content:center}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:40;backdrop-filter:blur(2px)}
.header{padding:20px 28px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center;gap:12px}
.page-title{font-size:17px;font-weight:700;letter-spacing:-0.3px}
.page-sub{font-size:11px;color:var(--text2);margin-top:2px}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn{padding:8px 16px;border-radius:9px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:'Sora',sans-serif;transition:all 0.18s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#3a7ce8;transform:translateY(-1px);box-shadow:0 4px 16px #4f8ef740}
.btn-ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{color:var(--text);border-color:var(--border3)}
.btn-sm{padding:6px 12px;font-size:11px}
.btn-danger{background:#ef444420;color:#ef4444;border:1px solid #ef444430}
.btn-danger:hover{background:#ef444430}
.btn-success{background:#10b98120;color:#10b981;border:1px solid #10b98130}
.btn-success:hover{background:#10b98130}
.content{padding:24px 28px;flex:1}
.page{display:none}
.page.active{display:block}
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-radius);padding:18px;position:relative;overflow:hidden;transition:all 0.2s}
.kpi-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi-card.blue::before{background:linear-gradient(90deg,#4f8ef7,#60a5fa)}
.kpi-card.purple::before{background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.kpi-card.green::before{background:linear-gradient(90deg,#10b981,#34d399)}
.kpi-card.amber::before{background:linear-gradient(90deg,#f59e0b,#fcd34d)}
.kpi-label{font-size:10.5px;color:var(--text2);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px;font-weight:500}
.kpi-value{font-size:22px;font-weight:700;letter-spacing:-1px;font-family:'JetBrains Mono',monospace}
.kpi-change{font-size:11px;margin-top:6px}
.up{color:#10b981}.down{color:#ef4444}
.kpi-icon{position:absolute;right:14px;top:14px;font-size:18px;opacity:0.12}
.charts-row{display:grid;grid-template-columns:1fr minmax(0,320px);gap:14px;margin-bottom:20px;height:auto}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-radius);padding:18px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.card-title{font-size:13px;font-weight:600;flex-shrink:0}
.tab-group{display:flex;gap:3px;background:var(--bg3);border-radius:7px;padding:3px}
.tab{padding:4px 10px;font-size:11px;border-radius:5px;cursor:pointer;color:var(--text2);transition:all 0.15s}
.tab.active{background:var(--bg4);color:var(--text)}
.donut-wrap{position:relative;width:150px;height:150px;margin:0 auto 14px}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-total{font-size:16px;font-weight:700;font-family:'JetBrains Mono',monospace}
.donut-lbl{font-size:10px;color:var(--text2)}
.legend{display:flex;flex-direction:column;gap:7px}
.legend-item{display:flex;align-items:center;justify-content:space-between;font-size:11.5px}
.legend-dot{width:7px;height:7px;border-radius:50%;margin-right:8px;flex-shrink:0}
.legend-left{display:flex;align-items:center}
.legend-pct{color:var(--text2);font-family:'JetBrains Mono',monospace;font-size:11px}
.bottom-row{display:grid;grid-template-columns:1fr minmax(0,290px);gap:14px;margin-bottom:20px}
.txn-list{display:flex;flex-direction:column;gap:2px}
.txn-item{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:9px;cursor:pointer;transition:background 0.15s}
.txn-item:hover{background:var(--bg3)}
.txn-left{display:flex;align-items:center;gap:10px}
.txn-emoji{width:34px;height:34px;border-radius:9px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.txn-name{font-size:12.5px;font-weight:500}
.txn-cat{font-size:10.5px;color:var(--text2)}
.txn-amount{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;text-align:right}
.txn-date{font-size:10px;color:var(--text3);margin-top:2px;text-align:right}
.txn-delete{opacity:0;font-size:12px;cursor:pointer;color:var(--accent5);transition:opacity 0.15s;padding:2px 6px;border-radius:4px;background:none;border:none;font-family:'Sora',sans-serif}
.txn-item:hover .txn-delete{opacity:1}
@media(max-width:768px){.txn-delete{opacity:0.6}}
.budget-items{display:flex;flex-direction:column;gap:12px}
.budget-item{}
.budget-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;align-items:center}
.budget-name{font-weight:500;font-size:12px}
.budget-nums{color:var(--text2);font-family:'JetBrains Mono',monospace;font-size:10.5px}
.progress-bar{height:5px;background:var(--bg4);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width 0.8s ease}
.goals-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.goal-card{background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:14px;transition:all 0.2s}
.goal-card:hover{border-color:var(--border2)}
.goal-bar{height:4px;background:var(--bg5);border-radius:4px;overflow:hidden;margin-bottom:8px}
.goal-fill{height:100%;border-radius:4px}
.txn-page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.filter-group{display:flex;gap:8px;flex-wrap:wrap}
.filter-select{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:6px 12px;color:var(--text);font-family:'Sora',sans-serif;font-size:12px;outline:none;cursor:pointer}
.txn-full-list{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-radius);overflow:hidden}
.txn-full-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);transition:background 0.15s;gap:8px;min-width:0}
.txn-full-item:last-child{border-bottom:none}
.txn-full-item:hover{background:var(--bg3)}
.txn-summary-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.txn-summary-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;flex:1;min-width:130px}
.txn-summary-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.txn-summary-val{font-size:16px;font-weight:700;font-family:'JetBrains Mono',monospace}
.budget-page-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.budget-page-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-radius);padding:18px}
.budget-stat{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px}
.budget-over{color:#ef4444;font-size:11px;margin-top:4px;font-weight:500}
.budget-ok{color:#10b981;font-size:11px;margin-top:4px;font-weight:500}
.goals-page-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.goal-page-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-radius);padding:18px;transition:all 0.2s}
.goal-page-card:hover{border-color:var(--border2)}
.goal-page-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.invest-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}
.invest-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-radius);padding:18px}
.invest-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.invest-name{font-size:13px;font-weight:600}
.invest-tag{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500}
.invest-amount{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;margin-bottom:4px}
.invest-meta{margin-top:10px;display:flex;gap:14px}
.invest-meta-item{font-size:11px;color:var(--text2)}
.invest-meta-val{font-weight:600;color:var(--text);font-family:'JetBrains Mono',monospace}
.portfolio-row{display:grid;grid-template-columns:1fr 280px;gap:14px}
.reports-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.insight-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.insight-item:last-child{border-bottom:none}
.insight-icon{font-size:18px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:9px;flex-shrink:0}
.insight-title{font-weight:600;margin-bottom:2px;font-size:12.5px}
.insight-text{font-size:11.5px;line-height:1.5}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(6px);padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:26px;width:100%;max-width:420px;position:relative;max-height:90vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:700;margin-bottom:18px}
.form-group{margin-bottom:14px}
.form-label{font-size:10.5px;color:var(--text2);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:5px;display:block;font-weight:500}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:9px 13px;color:var(--text);font-family:'Sora',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-toggle{display:flex;gap:6px}
.type-btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:'Sora',sans-serif;font-size:12px;cursor:pointer;transition:all 0.18s}
.type-btn.active.income{background:#10b98118;border-color:#10b981;color:#10b981}
.type-btn.active.expense{background:#ef444418;border-color:#ef4444;color:#ef4444}
.type-btn.active.liability{background:#f59e0b18;border-color:#f59e0b;color:#f59e0b}
.type-btn.active.receivable{background:#06b6d418;border-color:#06b6d4;color:#06b6d4}
.kpi-card.orange::before{background:linear-gradient(90deg,#f59e0b,#fcd34d)}
.kpi-card.cyan::before{background:linear-gradient(90deg,#06b6d4,#67e8f9)}
.modal-close{position:absolute;top:14px;right:14px;background:var(--bg4);border:none;color:var(--text2);font-size:14px;cursor:pointer;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{color:var(--text)}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;background:var(--bg4);border:1px solid var(--border)}
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-icon{font-size:32px;margin-bottom:10px}
.empty-text{font-size:13px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:12px 18px;font-size:13px;z-index:999;transform:translateY(80px);opacity:0;transition:all 0.3s;pointer-events:none;max-width:300px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-left:3px solid #10b981}
.toast.error{border-left:3px solid #ef4444}
.toast.info{border-left:3px solid #4f8ef7}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
@media(max-width:1100px){
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
  .goals-grid,.goals-page-grid{grid-template-columns:repeat(2,1fr)}
  .invest-grid{grid-template-columns:1fr}
  .portfolio-row{grid-template-columns:1fr}
  .reports-grid{grid-template-columns:1fr}
}
@media(max-width:900px){
  .charts-row{grid-template-columns:1fr}
  .bottom-row{grid-template-columns:1fr}
  .budget-page-grid{grid-template-columns:1fr}
}
@media(max-width:768px){
  :root{--sidebar-w:0px}
  .sidebar{transform:translateX(-240px);width:240px}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .hamburger{display:flex}
  .main{margin-left:0}
  .header{padding:14px 16px 14px 56px}
  .content{padding:16px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .goals-grid,.goals-page-grid{grid-template-columns:1fr 1fr}
  .modal{padding:20px}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .goals-grid,.goals-page-grid{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .header-right .chip{display:none}
  .txn-summary-bar{flex-direction:column}
  .budget-page-grid{grid-template-columns:1fr}
  .invest-grid{grid-template-columns:1fr}
  .portfolio-row{grid-template-columns:1fr}
  .reports-grid{grid-template-columns:1fr}
  .goals-page-grid{grid-template-columns:1fr}
  /* Header */
  .header{padding:10px 12px 10px 52px;gap:8px}
  .page-title{font-size:14px}
  .page-sub{font-size:10px}
  .btn{padding:7px 12px;font-size:11.5px}
  /* KPI cards */
  .kpi-card{padding:14px 12px}
  .kpi-value{font-size:17px;letter-spacing:-0.5px}
  .kpi-label{font-size:9.5px}
  .kpi-change{font-size:10px}
  .kpi-icon{font-size:15px;right:10px;top:10px}
  /* Content padding */
  .content{padding:12px}
  /* Cards */
  .card{padding:14px}
  .card-title{font-size:12px}
  /* Transactions */
  .txn-name{font-size:12px}
  .txn-cat{font-size:10px}
  .txn-amount{font-size:12px}
  /* Modal */
  .modal{padding:18px;max-height:95vh;border-radius:12px}
  .modal-title{font-size:14px;margin-bottom:14px}
  /* Add Transaction button in header */
  .header-right .btn-primary{font-size:11px;padding:7px 10px}
  /* Filter group wrap */
  .filter-group{gap:5px}
  .filter-select{font-size:11px;padding:5px 8px}
  /* Summary bar */
  .txn-summary-item{padding:10px 12px}
  .txn-summary-val{font-size:14px}
  /* Goal page */
  .goal-page-actions{gap:5px}
  .goal-page-actions .btn{font-size:11px;padding:6px 8px}
  /* Invest card */
  .invest-amount{font-size:18px}
  /* Login box */
  .login-box{padding:28px 20px;margin:16px}
  /* Category modal add row */
  #modal-manage-cats .modal{max-width:100%}
}

.card canvas {
  height: 200px !important;
}
@media(max-width:480px){
  .card canvas{height:200px !important}
  .donut-wrap{width:130px;height:130px}
}

/* ══ ACCOUNTS PAGE ══ */
.accounts-hero{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-bottom:28px}
.payment-card{
  width:100%;aspect-ratio:1.586/1;border-radius:18px;position:relative;overflow:hidden;cursor:pointer;
  transition:transform 0.25s cubic-bezier(.34,1.56,.64,1),box-shadow 0.25s;
  box-shadow:0 8px 32px #00000060;
  font-family:'JetBrains Mono',monospace;
}
.payment-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 60px #00000080}
.payment-card::before{content:'';position:absolute;inset:0;background:inherit;opacity:1}
/* Card designs */
.card-dbbl{background:linear-gradient(135deg,#0a1628 0%,#1a3a6b 45%,#0d2550 100%)}
.card-bkash{background:linear-gradient(135deg,#e2136e 0%,#c00d5e 50%,#8b0040 100%)}
.card-nagad{background:linear-gradient(135deg,#f7941d 0%,#f47920 40%,#e55a00 100%)}
.card-cash{background:linear-gradient(135deg,#0f4c35 0%,#1a6b48 50%,#0a3325 100%)}
/* Decorative circles on cards */
.card-circle1{position:absolute;width:200px;height:200px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);right:-40px;top:-60px}
.card-circle2{position:absolute;width:140px;height:140px;border-radius:50%;border:1px solid rgba(255,255,255,0.08);right:10px;top:-20px}
.card-chip{position:absolute;top:28px;left:26px;width:36px;height:28px;background:linear-gradient(135deg,#d4a843,#f0c860,#c9922a);border-radius:5px;display:flex;align-items:center;justify-content:center}
.card-chip::after{content:'';width:22px;height:18px;border:1.5px solid rgba(0,0,0,0.25);border-radius:3px;display:block}
.card-nfc{position:absolute;top:26px;left:70px;font-size:20px;opacity:0.7}
.card-logo-area{position:absolute;top:22px;right:20px;text-align:right}
.card-balance{position:absolute;bottom:52px;left:26px}
.card-balance-label{font-size:9px;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.card-balance-amount{font-size:22px;font-weight:700;color:#fff;letter-spacing:-0.5px;text-shadow:0 2px 8px rgba(0,0,0,0.3)}
.card-number{position:absolute;bottom:30px;left:26px;font-size:11px;letter-spacing:3px;color:rgba(255,255,255,0.5)}
